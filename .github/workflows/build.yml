name: Build and publish J2Droid
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'branding/**'
      - 'android-offline/**'
      - 'runtime/**'
      - 'runtime-extra/**'
      - 'runtime-m3g/**'
  workflow_dispatch:
concurrency:
  group: j2droid-main-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout J2Droid
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout shared JarNix and J2Legacy sources
        uses: actions/checkout@v4
        with:
          repository: ZenithUzu/JarNix-Java-ME-Porting-Toolkit
          ref: main
          path: _upstream
          persist-credentials: false
      - name: Import Android converter and shared runtime
        shell: bash
        run: |
          set -euo pipefail
          for folder in android-offline runtime runtime-extra runtime-m3g; do
            mkdir -p "$folder"
            if [ "$folder" = android-offline ]; then
              rsync -a --delete --exclude="converter/src/main/java/j2a/offline/MainActivity.java" --exclude="converter/src/main/java/j2a/offline/OfflineBuilder.java" --exclude="converter/src/main/AndroidManifest.xml" --exclude="converter/build.gradle" --exclude="converter/src/main/res/**" "_upstream/$folder/" "$folder/"
            elif [ "$folder" = runtime ]; then
              rsync -a --delete --exclude="src/main/java/j2a/core/Host.java" --exclude="src/main/java/j2a/core/J2meActivity.java" "_upstream/$folder/" "$folder/"
            else
              rsync -a --delete "_upstream/$folder/" "$folder/"
            fi
          done
          mkdir -p android-offline/converter/src/main/res/drawable
          mkdir -p android-offline/converter/src/main/res/mipmap-anydpi-v26
          cp branding/ic_j2droid_foreground.xml branding/ic_j2droid_monochrome.xml branding/ic_j2droid_background.xml android-offline/converter/src/main/res/drawable/
          cp branding/ic_launcher.xml android-offline/converter/src/main/res/mipmap-anydpi-v26/
          mkdir -p android-offline/converter/src/main/res/xml
          cat > android-offline/converter/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><files-path name="generated-apk" path="ready.apk"/></paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-offline/converter/src/main/AndroidManifest.xml')
          s=p.read_text()
          import xml.etree.ElementTree as ET
          ns='{http://schemas.android.com/apk/res/android}'
          root=ET.fromstring(s)
          app=root.find('application')
          if app is None:
              raise SystemExit('AndroidManifest.xml: missing application')
          app.set(ns+'label','J2Droid')
          app.set(ns+'icon','@mipmap/ic_launcher')
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          ET.ElementTree(root).write(p,encoding='unicode',xml_declaration=True)
          PY
          rm -rf _upstream
      - name: Commit imported source to J2Droid
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-offline runtime runtime-extra runtime-m3g
          if ! git diff --cached --quiet; then
            git commit -m "Sync J2Droid Android code and J2Legacy runtime from JarNix"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build single J2Droid APK
        working-directory: android-offline
        run: |
          chmod +x gradlew
          ./gradlew :converter:assembleDebug --stacktrace
      - name: Prepare sole distributable APK
        run: cp android-offline/converter/build/outputs/apk/debug/converter-debug.apk J2Droid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: J2Droid
          path: J2Droid.apk
          if-no-files-found: error
      - name: Publish one APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view j2droid-latest >/dev/null 2>&1; then
            gh release create j2droid-latest J2Droid.apk --title "J2Droid · Latest development build" --notes "Una sola APK de J2Droid. Incluye el motor J2Legacy para convertir juegos sin conexión. Compilación de desarrollo firmada con clave de depuración; no se garantiza actualización directa entre compilaciones."
          else
            gh release upload j2droid-latest J2Droid.apk --clobber
          fi
